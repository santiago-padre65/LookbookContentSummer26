<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Padre 65 · Lanzarote Content Lookbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ea;--ink:#1a1714;--muted:#8a7f70;--line:#e2dccf;--red:#a02c2c;--deep:#631c1c;--panel:#faf8f2;--shadow:0 24px 60px -28px rgba(50,20,20,.42)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.stage{position:fixed;inset:0}
.topbar{position:fixed;top:0;left:0;right:0;height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;z-index:40;pointer-events:none;background:rgba(244,241,234,.86);backdrop-filter:blur(8px)}
.brandwrap{display:flex;align-items:center;gap:12px}.brandwrap img{height:21px}
.brandwrap .sep{width:1px;height:19px;background:var(--line)}.brandwrap small{font:500 9px/1.4 'Inter';letter-spacing:.3em;color:var(--muted);text-transform:uppercase}
.pill{font:600 9px/1 'Inter';letter-spacing:.16em;text-transform:uppercase;color:#fff;background:var(--red);padding:6px 11px;border-radius:999px;pointer-events:auto}
.slide{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:58px 24px 56px;overflow:hidden}
.slide.active{display:flex}
.card{width:1200px;height:700px;flex:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;transform:scale(var(--s,1));transform-origin:center center}
.mediazone{flex:1;min-height:0;background:#1b1a17;padding:7px;display:grid;gap:7px}
.cell{position:relative;overflow:hidden;background:#000;min-width:0;min-height:0;border-radius:2px}
.cell video,.cell img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;top:11px;left:11px;font:600 9.5px/1 'Inter';letter-spacing:.15em;text-transform:uppercase;color:#fff;background:rgba(99,28,28,.92);padding:5px 10px;border-radius:999px;z-index:3;display:flex;align-items:center;gap:6px}
.tag .dotlive{width:5px;height:5px;border-radius:50%;background:#fff;animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
/* arrangements */
.mz-left2{grid-template-columns:1.95fr 1fr}
.mz-left2 .col2{display:grid;grid-template-rows:repeat(2,minmax(0,1fr));gap:7px;min-height:0}
.mz-below1{grid-template-rows:1.75fr 1fr}
.mz-below3{grid-template-rows:1.5fr 1fr}
.mz-below3 .row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;min-height:0}
.mz-side1{grid-template-columns:1.95fr 1fr}
.mz-sideL{grid-template-columns:1fr 1.95fr}
.mz-below2{grid-template-rows:2.45fr 1fr}
.mz-below2 .row2{display:grid;grid-template-columns:.82fr 1.18fr;gap:7px;min-height:0}
.mz-sideP{grid-template-columns:1.85fr 1fr}
/* caption bar */
.capbar{flex-shrink:0;padding:19px 32px;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;border-top:1px solid var(--line);background:var(--panel)}
.capL{min-width:0}
.eyebrow{font:600 9.5px/1 'Inter';letter-spacing:.24em;text-transform:uppercase;color:var(--red);margin-bottom:9px}
.eyebrow .place{color:var(--muted)}
.ptitle{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:33px;line-height:1.02;margin:0 0 6px}
.cap{font-size:13.5px;line-height:1.5;color:#4a423a;max-width:56ch}
.capR{display:flex;align-items:center;gap:16px;flex-shrink:0}
.meta{font:500 10px/1 'Inter';letter-spacing:.05em;color:var(--muted);display:flex;gap:9px;align-items:center}
.meta .chip{border:1px solid var(--line);border-radius:999px;padding:5px 9px;letter-spacing:.13em;text-transform:uppercase;font-size:8.5px}
.handle{font:600 11px/1 'Inter';color:var(--ink)}
.viewlink{font:600 10px/1 'Inter';letter-spacing:.11em;text-transform:uppercase;color:var(--red);text-decoration:none;border:1px solid var(--red);border-radius:999px;padding:9px 14px;white-space:nowrap}
.viewlink:hover{background:var(--red);color:#fff}
/* cover */
.cover{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px}
.cover.active{display:flex}
.cover .logo{width:min(430px,64vw)}.cover .mark{width:62px;margin-top:22px}
.cover .rule{width:64px;height:1px;background:var(--red);margin:26px auto}
.cover .sub{font-family:'Cormorant Garamond',serif;font-size:26px;color:#4a423a}.cover .sub em{font-style:italic;color:var(--red)}
.cover .meta2{margin-top:32px;font:500 11px/1.7 'Inter';letter-spacing:.22em;color:var(--muted);text-transform:uppercase}
.cover .note{position:absolute;bottom:72px;left:0;right:0;font:500 10px/1.5 'Inter';letter-spacing:.13em;text-transform:uppercase;color:var(--muted);opacity:.72}
.bottomnav{position:fixed;bottom:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:center;gap:20px;z-index:40;pointer-events:none;background:rgba(244,241,234,.86);backdrop-filter:blur(8px)}
.nav{pointer-events:auto;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:16px;color:var(--ink);display:flex;align-items:center;justify-content:center;transition:.2s}
.nav:hover{background:var(--red);color:#fff;border-color:var(--red)}
.counter{pointer-events:auto;font:600 12px/1 'Inter';letter-spacing:.18em;color:var(--muted);min-width:80px;text-align:center}
.progress{position:fixed;top:0;left:0;height:3px;background:var(--red);z-index:50;transition:width .3s}
@media (max-width:860px){
 .slide{padding:58px 0 70px;overflow-y:auto}
 .slide.active{display:block}
 .card{width:auto!important;height:auto!important;max-height:none;margin:0 10px;border-radius:8px;transform:none!important}
 .mediazone{display:flex!important;flex-direction:column;padding:6px}
 .mediazone .col2,.mediazone .row2,.mediazone .row3{display:flex!important;flex-direction:column;gap:6px}
 .cell{aspect-ratio:16/9}
 .capbar{flex-direction:column;align-items:flex-start;gap:14px;padding:20px 22px}
 .ptitle{font-size:28px}
 .capR{flex-wrap:wrap;gap:12px}
 .brandwrap small,.brandwrap .sep{display:none}
 .slide.active .card,.cover.active{animation:fadein .34s ease}
}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style></head><body>

 return `<div class="cell">${tag}${inner}</div>`;}
function mediazone(s){const V=cell(s.video,true,s.tag);const I=s.imgs.map(x=>cell(x));
 if(s.arrange==='left2') return `<div class="mediazone mz-left2">${V}<div class="col2">${I[0]}${I[1]}</div></div>`;
 if(s.arrange==='below1') return `<div class="mediazone mz-below1">${V}${I[0]}</div>`;
 if(s.arrange==='below3') return `<div class="mediazone mz-below3">${V}<div class="row3">${I.join('')}</div></div>`;
 if(s.arrange==='side1') return `<div class="mediazone mz-side1">${V}${I[0]}</div>`;
 if(s.arrange==='sideL') return `<div class="mediazone mz-sideL">${I[0]}${V}</div>`;
 if(s.arrange==='below2') return `<div class="mediazone mz-below2">${V}<div class="row2">${I[0]}${I[1]}</div></div>`;
 if(s.arrange==='sideP') return `<div class="mediazone mz-sideP">${V}${I[0]}</div>`;
 return '';}
const stage=document.getElementById('stage');let idx=0;const total=SLIDES.length+1;
const cover=document.createElement('div');cover.className='cover active';
cover.innerHTML=`<img class="logo" src="${LOGO}"><img class="mark" src="${MARK}">
 <div class="rule"></div><div class="sub">Lanzarote &nbsp;&bull;&nbsp; <em>Content Lookbook</em></div>
 <div class="meta2">Summer &rsquo;26 Campaign &nbsp;&bull;&nbsp; By Location &nbsp;&bull;&nbsp; @_padre65</div>
 <div class="note">Sample &nbsp;&bull;&nbsp; footage &amp; stills grouped by location</div>`;
stage.appendChild(cover);
SLIDES.forEach((s,i)=>{const el=document.createElement('div');el.className='slide';el.dataset.i=i;
 el.innerHTML=`<div class="card">${mediazone(s)}
  <div class="capbar"><div class="capL"><div class="eyebrow">${s.loc} <span class="place">&middot; ${s.place}</span></div>
   <h2 class="ptitle">${s.title}</h2><p class="cap">${s.cap}</p></div>
   <div class="capR"><div class="meta"><span class="chip">${s.tag}</span><span>${s.imgs.length} still${s.imgs.length>1?'s':''}</span></div>
   <span class="handle">@_padre65</span><a class="viewlink" href="https://instagram.com/_padre65" target="_blank" rel="noopener">Instagram &rarr;</a></div>
  </div></div>`;
 stage.appendChild(el);});
function manageVideos(){stage.querySelectorAll('.slide').forEach((sl,k)=>{const on=k===idx-1;
 sl.querySelectorAll('video').forEach(v=>{if(on){const p=v.play();if(p)p.catch(()=>{});}else v.pause();});});}
function show(){cover.classList.toggle('active',idx===0);
 stage.querySelectorAll('.slide').forEach((s,k)=>s.classList.toggle('active',k===idx-1));
 document.getElementById('counter').textContent=idx===0?"COVER":(String(idx).padStart(2,'0')+" / "+String(SLIDES.length).padStart(2,'0'));
 document.getElementById('prog').style.width=(idx/(total-1)*100)+'%';manageVideos();}
function go(d){idx=Math.max(0,Math.min(total-1,idx+d));show();}
function fit(){const dw=1200,dh=700;const availW=window.innerWidth-40;const availH=window.innerHeight-58-56-8;
 const s=Math.min(availW/dw,availH/dh,1);document.documentElement.style.setProperty('--s',s);}
window.addEventListener('resize',fit);fit();
document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown'].includes(e.key)){e.preventDefault();go(1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(-1)}});
let sx=null,sy=null;stage.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
stage.addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)go(dx<0?1:-1);sx=sy=null});
show();
</script></body></html>
